<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <h1>NEON RUNNER</h1>
        <p>Desvie dos obstáculos e faça a maior pontuação!</p>
      </div>
      <div class="score-box">
        <span>PONTOS</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <canvas id="game" width="900" height="500"></canvas>

    <section class="controls">
      <button id="startBtn">JOGAR</button>
      <span>Controles: <b>WASD</b> ou <b>SETAS</b></span>
    </section>

    <p id="message">Clique em JOGAR para começar.</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
